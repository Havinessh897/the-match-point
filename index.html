<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>THE MATCH POINT — Live Buzzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root{
    --bg:#0A0E1A;
    --panel:#131A2C;
    --panel-2:#1B2338;
    --line: rgba(244,246,251,0.08);
    --blue:#3D5AFE;
    --purple:#9D4EDD;
    --pink:#FF3DA6;
    --cyan:#22E7F5;
    --white:#F4F6FB;
    --muted:#7B87A8;
    --danger:#FF4D4D;
    --gold:#F5C542;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 600px at 15% -10%, rgba(61,90,254,0.20), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(255,61,166,0.16), transparent 60%),
      radial-gradient(700px 500px at 50% 120%, rgba(34,231,245,0.10), transparent 60%),
      var(--bg);
    color:var(--white);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:28px 18px 60px;
  }
  .wrap{width:100%;max-width:440px;margin:0 auto;}
  .wrap.wide{max-width:760px;}
  .brand{
    text-align:center;
    margin-bottom:8px;
  }
  .brand .spark{
    font-size:13px;
    letter-spacing:0.14em;
    color:var(--cyan);
    font-family:'Space Mono', monospace;
  }
  h1.title{
    font-family:'Archivo Black', sans-serif;
    font-size:40px;
    line-height:1.02;
    margin:6px 0 2px;
    background:linear-gradient(100deg, var(--blue), var(--purple) 45%, var(--pink) 85%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-align:center;
    text-shadow:0 0 44px rgba(157,78,221,0.25);
  }
  .subtitle{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin-bottom:30px;
  }
  .card{
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 22px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }
  .btn{
    width:100%;
    border:none;
    border-radius:12px;
    padding:16px 18px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    transition:transform .12s ease, opacity .12s ease;
    color:var(--white);
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{
    background:linear-gradient(100deg, var(--blue), var(--purple));
  }
  .btn-secondary{
    background:var(--panel-2);
    border:1px solid var(--line);
  }
  .btn-danger{
    background:linear-gradient(100deg, var(--danger), var(--pink));
  }
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin:14px 0 6px;
  }
  input[type=text], input[type=password]{
    width:100%;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line);
    border-radius:10px;
    padding:13px 14px;
    color:var(--white);
    font-family:'Space Grotesk', sans-serif;
    font-size:15px;
  }
  input::placeholder{color:#4c5877;}
  .link-btn{
    background:none;border:none;color:var(--muted);
    font-size:13px;text-decoration:underline;cursor:pointer;
    display:block;margin:22px auto 0;
  }
  .team-chip{
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .member{font-size:14px;color:var(--white);}
  .member .tag{color:var(--muted);font-size:11px;font-family:'Space Mono',monospace;}
  .status-pill{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'Space Mono', monospace;
    font-size:12px;letter-spacing:0.06em;
    padding:8px 14px;border-radius:999px;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--line);
    margin:0 auto 22px;
  }
  .dot{width:8px;height:8px;border-radius:50%;}
  .dot.closed{background:var(--danger); box-shadow:0 0 12px var(--danger);}
  .dot.open{background:var(--cyan); box-shadow:0 0 12px var(--cyan); animation:pulse 1.1s infinite;}
  .dot.wait{background:var(--gold); box-shadow:0 0 10px var(--gold);}
  @keyframes pulse{
    0%{opacity:1;} 50%{opacity:0.35;} 100%{opacity:1;}
  }
  .status-row{display:flex;justify-content:center;}
  .center{text-align:center;}
  .buzz-zone{
    display:flex;flex-direction:column;align-items:center;
    padding:30px 0 10px;
  }
  .buzz-btn{
    width:220px;height:220px;border-radius:50%;
    border:none;cursor:pointer;
    background:conic-gradient(from 180deg, var(--blue), var(--purple), var(--pink), var(--cyan), var(--blue));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 8px rgba(255,255,255,0.03), 0 20px 60px rgba(157,78,221,0.35);
    animation:ring 2.4s linear infinite, breathe 1.6s ease-in-out infinite;
  }
  @keyframes ring{ to{ filter:hue-rotate(360deg);} }
  @keyframes breathe{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.035);} }
  .buzz-btn:active{transform:scale(0.95);}
  .buzz-btn:disabled{animation:none; filter:grayscale(0.7); opacity:0.5; cursor:not-allowed;}
  .buzz-inner{
    width:180px;height:180px;border-radius:50%;
    background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Archivo Black', sans-serif;
    font-size:26px;letter-spacing:0.02em;
  }
  .buzz-inner span{font-size:12px;font-family:'Space Mono',monospace;color:var(--muted);margin-top:6px;letter-spacing:0.1em;}
  .waiting-note{
    text-align:center;color:var(--muted);font-size:13px;
    margin-top:26px;line-height:1.6;
  }
  .flash{
    text-align:center;
    font-family:'Archivo Black', sans-serif;
    font-size:30px;
    margin:10px 0 4px;
    color:var(--cyan);
    text-shadow:0 0 30px rgba(34,231,245,0.4);
  }
  .rank-list{margin-top:18px;}
  .rank-row{
    display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 14px;margin-bottom:8px;
  }
  .rank-num{
    font-family:'Space Mono',monospace;font-weight:700;
    width:26px;text-align:center;color:var(--gold);
  }
  .rank-row.me{border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan) inset;}
  .rank-team{flex:1;font-weight:600;font-size:14px;}
  .rank-name{font-size:12px;color:var(--muted);}
  .rank-time{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);}
  .stat-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    margin-bottom:20px;
  }
  .stat{
    background:rgba(255,255,255,0.03);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;text-align:center;
  }
  .stat .num{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;}
  .stat .lbl{font-size:11px;color:var(--muted);margin-top:2px;}
  .admin-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .admin-actions .full{grid-column:1 / -1;}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .top .badge{
    font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);
    border:1px solid var(--line);padding:5px 10px;border-radius:999px;
  }
  .qr-box{
    background:#fff;border-radius:14px;padding:14px;
    display:flex;align-items:center;justify-content:center;
    margin:18px auto;width:fit-content;
  }
  .divider{height:1px;background:var(--line);margin:20px 0;}
  .small-muted{font-size:12px;color:var(--muted);text-align:center;}
  .error{color:var(--danger);font-size:13px;text-align:center;margin-top:10px;}
  .badge-round{
    font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);
    text-align:center;margin-bottom:8px;letter-spacing:0.05em;
  }
  a.plain{color:var(--cyan);}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ========================= CONFIG ========================= */
// Change this passcode before your event. This is a light gate for a live-event host,
// not real account security — the backend rules below still stop participants from
// opening/closing the buzzer no matter what they try in their own browser.
const ADMIN_PASSCODE = "MATCHPOINT26";

/* ========================= STATE (in-memory only, per open tab) ========================= */
let view = 'landing';
let currentTeam = null;          // {id, name, members:[..]}
let myLastBuzzedRound = null;    // round number this tab has already buzzed in
let isAdmin = false;
let pollTimer = null;
let errorMsg = '';
let busy = false;

const app = document.getElementById('app');

/* ========================= STORAGE HELPERS ========================= */
/* ========================= SUPABASE STORAGE ========================= */

const SUPABASE_URL = "https://kljkhrygowzmhmhpxunf.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_RtuE9ok0R6-OgySBVLnKCg_9gss5DBb";

async function supabaseRequest(path, options = {}) {
  const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      "Prefer": "return=representation",
      ...(options.headers || {})
    }
  });

  if (!response.ok) {
    throw new Error(await response.text());
  }

  const text = await response.text();
  return text ? JSON.parse(text) : null;
}

async function safeGet(key, shared) {
  try {
    const rows = await supabaseRequest(
      `kv_store?key=eq.${encodeURIComponent(key)}&select=value`
    );
    return rows && rows.length ? rows[0].value : null;
  } catch (e) {
    console.error("safeGet:", e);
    return null;
  }
}

async function safeSet(key, value, shared) {
  try {
    await supabaseRequest("kv_store", {
      method: "POST",
      headers: {
        "Prefer": "resolution=merge-duplicates,return=representation"
      },
      body: JSON.stringify({
        key: key,
        value: value,
        shared: !!shared
      })
    });
    return true;
  } catch (e) {
    console.error("safeSet:", e);
    return null;
  }
}

async function safeList(prefix, shared) {
  try {
    const rows = await supabaseRequest(
      `kv_store?key=like.${encodeURIComponent(prefix)}*&select=key`
    );
    return { keys: (rows || []).map(row => row.key) };
  } catch (e) {
    console.error("safeList:", e);
    return { keys: [] };
  }
}

async function safeDelete(key, shared) {
  try {
    await supabaseRequest(
      `kv_store?key=eq.${encodeURIComponent(key)}`,
      { method: "DELETE" }
    );
    return true;
  } catch (e) {
    console.error("safeDelete:", e);
    return null;
  }
}

async function getRoundState(){
  const raw = await safeGet('round:state', true);
  if(!raw) return {roundNumber:1, status:'waiting', openedAt:null};
  try{ return JSON.parse(raw); }catch(e){ return {roundNumber:1, status:'waiting', openedAt:null}; }
}
async function setRoundState(s){
  await safeSet('round:state', JSON.stringify(s), true);
}
async function getTeamCount(){
  const keys = await safeList('team:', true);
  return keys.length;
}
async function getBuzzes(roundNumber){
  const keys = await safeList(`buzz:${roundNumber}:`, true);
  if(!keys.length) return [];
  const vals = await Promise.all(keys.map(k => safeGet(k, true)));
  const parsed = vals.map(v=>{ try{ return v ? JSON.parse(v) : null; }catch(e){ return null; } }).filter(Boolean);
  parsed.sort((a,b)=>a.timestamp-b.timestamp);
  return parsed;
}

/* ========================= NAV ========================= */
function setView(v){
  view = v;
  errorMsg = '';
  render();
}
function startPolling(fn, ms){
  stopPolling();
  pollTimer = setInterval(fn, ms || 1000);
  fn();
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}

/* ========================= ACTIONS ========================= */
async function registerTeam(){
  const name = document.getElementById('team-name').value.trim();
  const p1 = document.getElementById('p1').value.trim();
  const p2 = document.getElementById('p2').value.trim();
  const p3 = document.getElementById('p3').value.trim();
  if(!name || !p1){
    errorMsg = 'Team name and Participant 1 are required.';
    render();
    return;
  }
  busy = true; render();
  const members = [p1, p2, p3].filter(Boolean);
  const id = 't_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
  currentTeam = {id, name, members};
  await safeSet(`team:${id}`, JSON.stringify(currentTeam), true);
  busy = false;
  setView('waiting');
  watchWaitingRoom();
}

function watchWaitingRoom(){
  startPolling(async ()=>{
    if(view !== 'waiting') return;
    const rs = await getRoundState();
    if(rs.status === 'open' && myLastBuzzedRound !== rs.roundNumber){
      stopPolling();
      setView('buzzer');
      watchBuzzerScreen();
    } else {
      renderRoundBadge(rs);
    }
  }, 900);
}

function watchBuzzerScreen(){
  startPolling(async ()=>{
    if(view !== 'buzzer') return;
    const rs = await getRoundState();
    if(rs.status !== 'open'){
      stopPolling();
      setView('waiting');
      watchWaitingRoom();
    } else {
      renderRoundBadge(rs);
    }
  }, 700);
}

async function pressBuzzer(){
  if(busy) return;
  busy = true;
  const rs = await getRoundState();
  if(rs.status !== 'open'){ busy = false; return; }
  const payload = {
    teamId: currentTeam.id,
    teamName: currentTeam.name,
    participant: currentTeam.members[0],
    timestamp: Date.now()
  };
  await safeSet(`buzz:${rs.roundNumber}:${currentTeam.id}`, JSON.stringify(payload), true);
  myLastBuzzedRound = rs.roundNumber;
  busy = false;
  stopPolling();
  setView('buzzed');
  watchBuzzedScreen(rs.roundNumber);
}

function watchBuzzedScreen(roundNumber){
  startPolling(async ()=>{
    const rs = await getRoundState();
    const buzzes = await getBuzzes(roundNumber);
    renderBuzzedResults(rs, buzzes, roundNumber);
    if(rs.roundNumber !== roundNumber || rs.status === 'waiting'){
      stopPolling();
      setView('waiting');
      watchWaitingRoom();
    }
  }, 900);
}

async function adminLogin(){
  const pass = document.getElementById('admin-pass').value;
  if(pass !== ADMIN_PASSCODE){
    errorMsg = 'Incorrect host passcode.';
    render();
    return;
  }
  isAdmin = true;
  setView('admin');
  watchAdmin();
}

function watchAdmin(){
  startPolling(async ()=>{
    if(view !== 'admin') return;
    const rs = await getRoundState();
    const [teamCount, buzzes] = await Promise.all([getTeamCount(), getBuzzes(rs.roundNumber)]);
    renderAdminBody(rs, teamCount, buzzes);
  }, 900);
}

async function openBuzzer(){
  const rs = await getRoundState();
  await setRoundState({...rs, status:'open', openedAt: Date.now()});
}
async function closeBuzzer(){
  const rs = await getRoundState();
  await setRoundState({...rs, status:'closed'});
}
async function nextRound(){
  const rs = await getRoundState();
  await setRoundState({roundNumber: rs.roundNumber+1, status:'waiting', openedAt:null});
}
async function resetRound(){
  const rs = await getRoundState();
  const keys = await safeList(`buzz:${rs.roundNumber}:`, true);
  await Promise.all(keys.map(k=>safeDelete(k, true)));
  await setRoundState({...rs, status:'waiting', openedAt:null});
}

/* ========================= SMALL DOM HELPERS (avoid full re-render flicker on poll) ========================= */
function renderRoundBadge(rs){
  const el = document.getElementById('round-badge');
  if(el) el.textContent = `ROUND ${rs.roundNumber}`;
  const pill = document.getElementById('status-pill-text');
  if(pill) pill.textContent = rs.status === 'open' ? 'BUZZER LIVE' : rs.status === 'closed' ? 'BUZZER CLOSED' : 'WAITING FOR HOST';
}
function renderBuzzedResults(rs, buzzes, myRound){
  const el = document.getElementById('buzzed-ranklist');
  if(!el) return;
  const top5 = buzzes.slice(0,5);
  el.innerHTML = top5.map((b, i)=>{
    const mine = b.teamId === currentTeam.id;
    return `<div class="rank-row ${mine ? 'me':''}">
      <div class="rank-num">${i+1}</div>
      <div style="flex:1">
        <div class="rank-team">${escapeHtml(b.teamName)}</div>
        <div class="rank-name">${escapeHtml(b.participant||'')}</div>
      </div>
      <div class="rank-time">${new Date(b.timestamp).toLocaleTimeString()}</div>
    </div>`;
  }).join('') || `<div class="small-muted">Waiting for the field to lock in…</div>`;
}
function renderAdminBody(rs, teamCount, buzzes){
  const statNum = document.getElementById('admin-teamcount');
  if(statNum) statNum.textContent = teamCount;
  const buzzNum = document.getElementById('admin-buzzcount');
  if(buzzNum) buzzNum.textContent = buzzes.length;
  const roundNum = document.getElementById('admin-round');
  if(roundNum) roundNum.textContent = rs.roundNumber;
  const dot = document.getElementById('admin-status-dot');
  const statusText = document.getElementById('admin-status-text');
  if(dot && statusText){
    dot.className = 'dot ' + (rs.status === 'open' ? 'open' : rs.status === 'closed' ? 'closed' : 'wait');
    statusText.textContent = rs.status.toUpperCase();
  }
  const openBtn = document.getElementById('btn-open');
  const closeBtn = document.getElementById('btn-close');
  if(openBtn) openBtn.disabled = rs.status === 'open';
  if(closeBtn) closeBtn.disabled = rs.status !== 'open';

  const list = document.getElementById('admin-ranklist');
  if(list){
    const top5 = buzzes.slice(0,5);
    list.innerHTML = top5.map((b,i)=>`
      <div class="rank-row">
        <div class="rank-num">${i+1}</div>
        <div style="flex:1">
          <div class="rank-team">${escapeHtml(b.teamName)}</div>
          <div class="rank-name">${escapeHtml(b.participant||'')}</div>
        </div>
        <div class="rank-time">${new Date(b.timestamp).toLocaleTimeString()}</div>
      </div>`).join('') || `<div class="small-muted">No buzzes yet this round.</div>`;
  }
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ========================= VIEWS ========================= */
function render(){
  stopPollingIfLeavingLiveView();
  switch(view){
    case 'landing': return renderLanding();
    case 'register': return renderRegister();
    case 'waiting': return renderWaiting();
    case 'buzzer': return renderBuzzer();
    case 'buzzed': return renderBuzzed();
    case 'admin-login': return renderAdminLogin();
    case 'admin': return renderAdminDashboard();
  }
}
function stopPollingIfLeavingLiveView(){
  // polling is (re)started explicitly by the functions that enter each live view
}

function shell(inner, wide){
  app.innerHTML = `<div class="wrap ${wide?'wide':''}">${inner}</div>`;
}

function renderLanding(){
  shell(`
    <div class="brand">
      <div class="spark">⚡ LIVE BUZZER · INITIUM</div>
      <h1 class="title">THE MATCH<br/>POINT</h1>
      <div class="subtitle">Round 3 — Rapid Fire · Scan in, stay ready, buzz first.</div>
    </div>
    <div class="card">
      <button class="btn btn-primary" onclick="setView('register')">JOIN THE GAME</button>
      <div class="small-muted" style="margin-top:14px;">Keep this tab open through the event — that's how your team's buzzer stays live.</div>
    </div>
    <button class="link-btn" onclick="setView('admin-login')">Host login</button>
  `);
}

function renderRegister(){
  shell(`
    <div class="brand">
      <div class="spark">TEAM REGISTRATION</div>
      <h1 class="title" style="font-size:28px;">JOIN THE MATCH</h1>
    </div>
    <div class="card">
      <label>Team name</label>
      <input id="team-name" type="text" placeholder="e.g. Super Kings">
      <label>Participant 1 (required)</label>
      <input id="p1" type="text" placeholder="Full name">
      <label>Participant 2 (optional)</label>
      <input id="p2" type="text" placeholder="Full name">
      <label>Participant 3 (optional)</label>
      <input id="p3" type="text" placeholder="Full name">
      <button class="btn btn-primary" style="margin-top:20px;" onclick="registerTeam()" ${busy?'disabled':''}>${busy?'ENTERING…':'ENTER GAME'}</button>
      ${errorMsg ? `<div class="error">${escapeHtml(errorMsg)}</div>` : ''}
    </div>
    <button class="link-btn" onclick="setView('landing')">Back</button>
  `);
}

function renderWaiting(){
  shell(`
    <div class="badge-round" id="round-badge">ROUND</div>
    <div class="brand" style="margin-bottom:14px;">
      <div class="spark">⚡ THE MATCH POINT</div>
      <h1 class="title" style="font-size:26px;">${escapeHtml(currentTeam.name)}</h1>
    </div>
    <div class="card">
      ${currentTeam.members.map(m=>`<div class="team-chip"><span class="member">${escapeHtml(m)}</span></div>`).join('')}
      <div class="divider"></div>
      <div class="status-row">
        <div class="status-pill"><span class="dot wait"></span><span id="status-pill-text">WAITING FOR HOST</span></div>
      </div>
      <div class="waiting-note">Buzzer is locked. It unlocks the instant the host opens this round — no need to refresh.</div>
    </div>
  `);
  // fill badge immediately once known
  getRoundState().then(renderRoundBadge);
}

function renderBuzzer(){
  shell(`
    <div class="badge-round" id="round-badge">ROUND</div>
    <div class="status-row">
      <div class="status-pill"><span class="dot open"></span><span id="status-pill-text">BUZZER LIVE</span></div>
    </div>
    <div class="buzz-zone">
      <button class="buzz-btn" onclick="pressBuzzer()" ${busy?'disabled':''}>
        <div class="buzz-inner">
          BUZZ
          <span>${escapeHtml(currentTeam.name)}</span>
        </div>
      </button>
    </div>
    <div class="waiting-note">Be the fastest. One tap locks it in for your team.</div>
  `);
  getRoundState().then(renderRoundBadge);
}

function renderBuzzed(){
  shell(`
    <div class="flash">BUZZED IN!</div>
    <div class="center small-muted" style="margin-bottom:6px;">${escapeHtml(currentTeam.members[0])} · ${escapeHtml(currentTeam.name)}</div>
    <div class="card" style="margin-top:18px;">
      <div class="small-muted" style="text-align:center;letter-spacing:0.08em;">LIVE STANDINGS</div>
      <div class="rank-list" id="buzzed-ranklist"></div>
    </div>
    <div class="waiting-note">Wait for the host's call.</div>
  `);
}

function renderAdminLogin(){
  shell(`
    <div class="brand">
      <div class="spark">HOST ACCESS</div>
      <h1 class="title" style="font-size:28px;">THE MATCH POINT</h1>
    </div>
    <div class="card">
      <label>Host passcode</label>
      <input id="admin-pass" type="password" placeholder="Enter passcode" onkeydown="if(event.key==='Enter')adminLogin()">
      <button class="btn btn-primary" style="margin-top:18px;" onclick="adminLogin()">LOG IN</button>
      ${errorMsg ? `<div class="error">${escapeHtml(errorMsg)}</div>` : ''}
    </div>
    <button class="link-btn" onclick="setView('landing')">Back</button>
  `);
}

function renderAdminDashboard(){
  const shareUrl = window.location.href;
  shell(`
    <div class="top">
      <h1 class="title" style="font-size:24px;text-align:left;">HOST PANEL</h1>
      <span class="badge">ROUND <span id="admin-round">1</span></span>
    </div>
    <div class="card">
      <div class="status-row" style="margin-bottom:18px;">
        <div class="status-pill"><span class="dot wait" id="admin-status-dot"></span><span id="admin-status-text">WAITING</span></div>
      </div>
      <div class="stat-grid">
        <div class="stat"><div class="num" id="admin-teamcount">0</div><div class="lbl">REGISTERED TEAMS</div></div>
        <div class="stat"><div class="num" id="admin-buzzcount">0</div><div class="lbl">BUZZES THIS ROUND</div></div>
      </div>
      <button class="btn btn-primary" id="btn-open" onclick="openBuzzer()">OPEN BUZZER</button>
      <div class="admin-actions">
        <button class="btn btn-danger" id="btn-close" onclick="closeBuzzer()">CLOSE BUZZER</button>
        <button class="btn btn-secondary" onclick="resetRound()">RESET ROUND</button>
        <button class="btn btn-secondary full" onclick="nextRound()">START NEXT ROUND →</button>
      </div>
      <div class="divider"></div>
      <div class="small-muted" style="letter-spacing:0.08em;margin-bottom:10px;">TOP 5 — THIS ROUND</div>
      <div class="rank-list" id="admin-ranklist"></div>
      <div class="divider"></div>
      <div class="small-muted" style="letter-spacing:0.08em;">SHARE / QR</div>
      <div class="qr-box" id="qr-box"></div>
      <div class="small-muted" style="word-break:break-all;">${escapeHtml(shareUrl)}</div>
    </div>
    <button class="link-btn" onclick="isAdmin=false; stopPolling(); setView('landing');">Log out</button>
  `, true);
  try{
    const qrBox = document.getElementById('qr-box');
    if(qrBox){
      if(window.qrcode){
        const qr = qrcode(0, 'M');
        qr.addData(shareUrl);
        qr.make();
        qrBox.innerHTML = qr.createSvgTag({cellSize:5, margin:4});
      } else {
        qrBox.innerHTML = '<div style="color:#0A0E1A;font-family:sans-serif;font-size:12px;padding:20px;text-align:center;max-width:150px;">QR library did not load — share the link below instead.</div>';
      }
    }
  }catch(e){
    const qrBox = document.getElementById('qr-box');
    if(qrBox) qrBox.innerHTML = '<div style="color:#0A0E1A;font-family:sans-serif;font-size:12px;padding:20px;text-align:center;max-width:150px;">QR failed to render — share the link below instead.</div>';
  }
}

/* boot */
setView('landing');
</script>
</body>
</html>
